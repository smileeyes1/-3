<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مغامرة الضرب في ثلاثة</title>
<style>
body {font-family: Arial, sans-serif; background: linear-gradient(#87ceeb, #e0ffff); margin: 0; padding: 20px; color: #000000; text-align: center; font-size: 22px;}
h1 {color: #000000; font-size: 50px;}
h2 {color: #000000; font-size: 35px;}
.door {background: #ffdd55; border: 5px solid #ff8000; border-radius: 20px; padding: 25px; margin: 15px; font-size: 28px; cursor: pointer; display: inline-block; width: 300px; color: #000000;}
.door:hover {transform: scale(1.1); background: #ffd700;}
.level {display: none; background: white; border-radius: 20px; padding: 40px; margin: 20px auto; max-width: 900px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); color: #000000;}
button {background: #32cd32; color: #000000; border: none; padding: 20px 40px; font-size: 26px; border-radius: 15px; margin: 15px; cursor: pointer;}
.circle {width: 60px; height: 60px; background: red; border-radius: 50%; display: inline-block; margin: 10px; animation: pop 0.4s;}
@keyframes pop {from {transform: scale(0);} to {transform: scale(1);}}
.star {font-size: 55px; color: gold; animation: twinkle 0.8s infinite;}
@keyframes twinkle {0%,100% {opacity: 1;} 50% {opacity: 0.3;}}
#score {font-size: 32px; color: #000000; margin: 20px;}
#progress {height: 25px; background: #32cd32; width: 0%; border-radius: 10px; transition: width 1s;}
</style>
</head>
<body>

<h1>بسم الله الرحمن الرحيم</h1>
<h2>مغامرة الضرب في ثلاثة</h2>

<div id="score">نقاطك: <span id="points">٠</span></div>
<div style="width:80%; margin:15px auto; background:#ddd; border-radius:10px;"><div id="progress"></div></div>

<div id="doors">
<button class="door" onclick="startAdventure(1)">مغامرة الدوائر السحرية</button>
<button class="door" onclick="startAdventure(2)">قصر جدول الثلاثة</button>
<button class="door" onclick="startAdventure(3)">جبل المقارنة</button>
<button class="door" onclick="startAdventure(4)">حديقة القصص الحقيقية</button>
<button class="door" onclick="startAdventure(5)">الكنز النهائي</button>
</div>

<div id="adv1" class="level">
<h3>اضف مجموعات وشاهد الضرب يحدث سحريا</h3>
<button onclick="addGroup()">اضف مجموعة جديدة</button>
<button onclick="clearGroups()">امسح وابدأ من جديد</button>
<div id="visual1"></div>
<p id="eq1" style="font-size:28px;"></p>
</div>

<div id="adv2" class="level">
<h3>جدول الثلاثة الملون</h3>
<table border="1" style="margin:auto; font-size:28px; color:#000000;">
<tr><td>١ × ٣</td><td>٣</td></tr>
<tr><td>٢ × ٣</td><td>٦</td></tr>
<tr><td>٣ × ٣</td><td>٩</td></tr>
<tr><td>٤ × ٣</td><td>١٢</td></tr>
<tr><td>٥ × ٣</td><td>١٥</td></tr>
</table>
<button onclick="showTableMagic()">اضغط لترى السحر</button>
<div id="magic" style="font-size:26px; color:#000000;"></div>
</div>

<div id="adv3" class="level">
<h3>اختر الاشارة الصحيحة</h3>
<p id="q3" style="font-size:30px;"></p>
<button onclick="checkCompare('=')">=</button>
<button onclick="checkCompare('>')">></button>
<button onclick="checkCompare('<')"><</button>
<p id="fb3" style="font-size:26px;"></p>
</div>

<div id="adv4" class="level">
<h3>حديقة القصص من درسك</h3>
<p style="font-size:26px;">نوافذ المسجد</p>
<button onclick="solveWindow()">احسب عدد النوافذ × ٣</button>
<p id="res4" style="font-size:26px;"></p>
<button onclick="solveMerchant()">مسألة التاجر اربع قصص</button>
</div>

<div id="adv5" class="level">
<h3>الكنز النهائي ١٠ تحديات</h3>
<p id="finalQ" style="font-size:28px;"></p>
<input id="finalAns" type="number" placeholder="اكتب الجواب" style="font-size:26px; padding:10px;">
<button onclick="checkFinal()">تحقق</button>
<p id="finalFb" style="font-size:26px;"></p>
<div id="stars"></div>
</div>

<div id="certificate" class="level" style="display:none; background:gold; color:#000000;">
<h3>مبروك يا بطل</h3>
<p style="font-size:28px;">لقد تعلمت الضرب في ثلاثة بنجاح</p>
<button onclick="printCertificate()">اطبع الشهادة</button>
</div>

<script>
let points = 0;
let progress = 0;
let groups = 0;
let correctFinal = 0;
let finalCount = 0;

function toArabic(n) {
return n.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}

function updateScore() {
document.getElementById('points').innerText = toArabic(points);
progress = Math.min(100, points / 2);
document.getElementById('progress').style.width = progress + '%';
}

function playSound(type) {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain);
gain.connect(ctx.destination);
if (type === 'correct') {
osc.frequency.value = 800;
osc.type = 'sine';
gain.gain.value = 0.8;
setTimeout(() => gain.gain.value = 0, 200);
} else {
osc.frequency.value = 300;
osc.type = 'sawtooth';
gain.gain.value = 0.6;
setTimeout(() => gain.gain.value = 0, 400);
}
osc.start();
setTimeout(() => osc.stop(), 600);
}

function createStar() {
const star = document.createElement('div');
star.className = 'star';
star.innerText = '★';
document.body.appendChild(star);
setTimeout(() => star.remove(), 3000);
}

function startAdventure(n) {
document.querySelectorAll('.level').forEach(l => l.style.display = 'none');
document.getElementById('adv' + n).style.display = 'block';
if (n === 5) generateFinalQuestion();
}

function addGroup() {
groups++;
const v = document.getElementById('visual1');
v.innerHTML = '';
for (let i = 0; i < groups; i++) {
const g = document.createElement('div');
for (let j = 0; j < 3; j++) {
const c = document.createElement('div');
c.className = 'circle';
g.appendChild(c);
}
v.appendChild(g);
}
document.getElementById('eq1').innerText = toArabic(groups) + ' × ٣ = ' + toArabic(groups * 3);
points += 8;
updateScore();
playSound('correct');
createStar();
if (groups >= 5) {
document.getElementById('eq1').innerHTML += ' برافو يا بطل!';
}
}

function clearGroups() {
groups = 0;
document.getElementById('visual1').innerHTML = '';
document.getElementById('eq1').innerText = '';
}

function showTableMagic() {
document.getElementById('magic').innerHTML = 'انظر كل سطر يطير ثلاث كرات سحرية';
playSound('correct');
createStar();
points += 10;
updateScore();
}

let compareCorrect = '';
function generateCompare() {
const a = Math.floor(Math.random() * 5) + 1;
compareCorrect = '=';
document.getElementById('q3').innerText = toArabic(a * 3) + ' ○ ' + toArabic(a * 3);
}
function checkCompare(ans) {
if (ans === compareCorrect) {
document.getElementById('fb3').innerHTML = 'صحيح تماما';
playSound('correct');
createStar();
points += 12;
updateScore();
generateCompare();
} else {
document.getElementById('fb3').innerText = 'حاول مرة اخرى';
playSound('wrong');
}
}

function solveWindow() {
document.getElementById('res4').innerText = 'عدد النوافذ × ٣ = ١٥';
points += 15;
updateScore();
playSound('correct');
createStar();
}

function solveMerchant() {
document.getElementById('res4').innerText = '٤ قصص × ٣ دنانير = ١٢ دينار';
points += 15;
updateScore();
playSound('correct');
createStar();
}

function generateFinalQuestion() {
const a = Math.floor(Math.random() * 5) + 1;
correctFinal = a * 3;
document.getElementById('finalQ').innerText = 'كم هو ' + toArabic(a) + ' × ٣ ؟';
document.getElementById('finalAns').value = '';
document.getElementById('finalFb').innerText = '';
}

function checkFinal() {
const ans = parseInt(document.getElementById('finalAns').value);
if (ans === correctFinal) {
document.getElementById('finalFb').innerHTML = 'صحيح يا اسطورة';
playSound('correct');
createStar();
points += 20;
updateScore();
finalCount++;
if (finalCount >= 8) {
document.getElementById('certificate').style.display = 'block';
}
generateFinalQuestion();
} else {
document.getElementById('finalFb').innerText = 'قريب حاول تاني';
playSound('wrong');
}
}

function printCertificate() {
window.print();
}

window.onload = () => {
updateScore();
generateCompare();
};
</script>
</body>
</html>
